<!DOCTYPE html>
<html lang="ur" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Tarbiyat Hub - Safe & Educational Kids Videos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; }

        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col text-slate-100">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <!-- Logo -->
            <div id="mainLogo" class="flex items-center space-x-2 cursor-pointer transition-all duration-300" onclick="resetToHome()">
                <div class="bg-amber-500 p-2 rounded-2xl text-slate-900 font-bold">
                    <i data-lucide="smile" class="w-7 h-7"></i>
                </div>
                <span class="text-2xl font-bold text-amber-500 tracking-wide">KidsTarbiyat</span>
            </div>

            <!-- Search Bar -->
            <div id="searchBarWrapper" class="flex-1 max-w-md relative transition-all duration-300">
                <input type="text" id="searchInput" placeholder="Search safe kids videos..." 
                       class="w-full pl-10 pr-24 py-2 bg-slate-900 border border-slate-700 rounded-full text-slate-100 focus:outline-none focus:border-amber-500 transition text-sm">
                <i data-lucide="search" class="w-5 h-5 text-slate-400 absolute left-3 top-2.5"></i>
                <button onclick="handleSearch()" class="absolute right-1 top-1 bg-amber-500 hover:bg-amber-600 text-slate-950 px-4 py-1.5 rounded-full text-xs font-bold transition">
                    Search
                </button>
            </div>

            <!-- Parental Control Lock Toggle -->
            <button id="lockToggleBtn" onclick="openParentModal()" class="flex items-center gap-2 bg-slate-700 hover:bg-slate-600 text-amber-400 px-4 py-2 rounded-xl text-xs font-bold transition border border-slate-600">
                <i data-lucide="lock" class="w-4 h-4"></i>
                <span id="lockStatusText">Search: Safe Mode</span>
            </button>
        </div>
    </header>

    <!-- Category Tabs -->
    <nav id="categoryNav" class="bg-slate-800/80 border-b border-slate-700/60 py-2.5 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 flex gap-2 overflow-x-auto pb-1 no-scrollbar">
            <button onclick="selectCategory('Islami Tarbiyat Kids')" class="cat-btn bg-amber-500 text-slate-950 px-4 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap shadow-sm">
                🕌 Islami Tarbiyat
            </button>
            <button onclick="fetchShortsVideos('Islamic Tarbiyat Kids Shorts')" class="cat-btn bg-red-600 hover:bg-red-500 text-white px-4 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap shadow-sm flex items-center gap-1.5 animate-pulse">
                <i data-lucide="film" class="w-3.5 h-3.5"></i> 🎬 Shorts
            </button>
            <button onclick="selectCategory('Moral Stories for Kids English Urdu')" class="cat-btn bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap shadow-sm">
                📖 Moral Stories
            </button>
            <button onclick="selectCategory('Good Habits for Kids')" class="cat-btn bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap shadow-sm">
                ⭐ Good Habits
            </button>
            <button onclick="selectCategory('Kids Urdu Poems Nazmein')" class="cat-btn bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap shadow-sm">
                🎵 Rhymes & Poems
            </button>
            <button onclick="showFavorites()" class="cat-btn bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap shadow-sm flex items-center gap-1">
                <i data-lucide="heart" class="w-3.5 h-3.5 text-red-500 fill-red-500"></i> Saved
            </button>
        </div>
    </nav>

    <!-- MAIN YOUTUBE STYLE THEATER PLAYER AREA -->
    <section id="cinemaPlayerSection" class="hidden bg-black border-b border-slate-800 py-6">
        <div class="max-w-7xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Main Video Column -->
            <div class="lg:col-span-2 flex flex-col">
                <div class="relative w-full aspect-video bg-slate-950 rounded-2xl overflow-hidden shadow-2xl border border-slate-800">
                    <div id="youtubePlayerContainer" class="w-full h-full"></div>
                </div>

                <div class="mt-4 flex flex-col gap-3">
                    <h1 id="activeVideoTitle" class="text-lg sm:text-xl font-bold text-slate-100 line-clamp-2">Select a video to play</h1>
                    
                    <div class="flex flex-wrap justify-between items-center gap-4 pb-4 border-b border-slate-800">
                        <div class="flex items-center gap-3">
                            <div class="bg-amber-500 text-slate-950 w-10 h-10 rounded-full flex items-center justify-center font-bold text-base">
                                <i data-lucide="tv" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h4 id="activeChannelTitle" class="font-bold text-sm text-slate-200">Kids Channel</h4>
                                <p class="text-[11px] text-emerald-400 font-semibold flex items-center gap-1">
                                    <i data-lucide="check-circle-2" class="w-3 h-3"></i> Fast Streaming Active
                                </p>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex items-center gap-2 flex-wrap">
                            <a id="externalWatchBtn" target="_blank" href="#" class="flex items-center gap-1.5 bg-red-600 hover:bg-red-700 text-white px-3.5 py-2 rounded-full text-xs font-bold transition">
                                <i data-lucide="youtube" class="w-4 h-4"></i> Watch on YouTube
                            </a>
                            <button id="likeBtn" onclick="toggleLikeActive()" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-full text-xs font-semibold transition">
                                <i data-lucide="thumbs-up" class="w-4 h-4"></i> <span id="likeText">Like</span>
                            </button>
                            <button id="favBtn" onclick="toggleFavActive()" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-full text-xs font-semibold transition">
                                <i data-lucide="heart" class="w-4 h-4"></i> Save
                            </button>
                            <button onclick="closeTheaterPlayer()" class="flex items-center gap-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 px-3 py-2 rounded-full text-xs font-semibold transition border border-red-500/20">
                                <i data-lucide="x" class="w-4 h-4"></i> Close
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Up Next Sidebar -->
            <div class="flex flex-col gap-3">
                <h3 class="font-bold text-sm text-slate-400 uppercase tracking-wider flex items-center gap-2">
                    <i data-lucide="play-square" class="w-4 h-4 text-amber-500"></i> Up Next / Safe Content
                </h3>
                <div id="sidebarContainer" class="flex flex-col gap-3 max-h-[500px] overflow-y-auto pr-1"></div>
            </div>
        </div>
    </section>

    <!-- Main Content Grid -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
        <div class="flex justify-between items-center mb-6">
            <h2 id="sectionTitle" class="text-xl font-bold text-slate-100 flex items-center gap-2">
                <i data-lucide="sparkles" class="text-amber-500"></i> Islami Tarbiyat
            </h2>
            <span id="videoCount" class="text-xs font-semibold text-slate-400">Loading videos...</span>
        </div>

        <div id="videoContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

        <div id="emptyState" class="hidden text-center py-16">
            <i data-lucide="video-off" class="w-16 h-16 text-slate-600 mx-auto mb-3"></i>
            <p class="text-slate-400 font-semibold" id="emptyMessage">No safe videos found.</p>
        </div>
    </main>

    <!-- NATIVE FINGER SCROLL YOUTUBE SHORTS MODAL -->
    <div id="shortsModal" class="fixed inset-0 bg-black/95 z-50 hidden flex items-center justify-center p-0 sm:p-4 select-none">
        
        <!-- Close Button -->
        <button onclick="closeShortsModal()" class="absolute top-4 right-4 z-40 bg-black/60 hover:bg-black/90 text-white p-3 rounded-full border border-white/20 transition">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>

        <!-- Vertical Native Scroll Container -->
        <div id="shortsScrollContainer" class="relative w-full max-w-md h-full sm:h-[92vh] bg-slate-950 sm:rounded-3xl overflow-y-scroll snap-y snap-mandatory no-scrollbar shadow-2xl border border-slate-800">
            <!-- Shorts Dynamic Reel Cards will render here -->
        </div>
    </div>

    <!-- Parental Control Modal -->
    <div id="parentModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center">
            <div class="bg-amber-500/10 text-amber-500 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3 border border-amber-500/20">
                <i data-lucide="shield-check" class="w-6 h-6"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-100">Parental Control</h3>
            <p class="text-xs text-slate-400 mt-1 mb-4">Enter PIN to toggle search permissions (Default PIN: 1234)</p>
            
            <input type="password" id="pinInput" placeholder="Enter PIN" maxlength="4" 
                   class="w-full text-center tracking-widest text-xl font-bold py-2 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-amber-500 mb-4 text-slate-100">
            
            <div class="flex gap-2">
                <button onclick="closeParentModal()" class="flex-1 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold rounded-xl transition">Cancel</button>
                <button onclick="verifyPIN()" class="flex-1 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-bold rounded-xl transition">Unlock</button>
            </div>
        </div>
    </div>

    <script>
        const YOUTUBE_API_KEY = "AIzaSyBjFaFHtHp2auL96X20FR3ivu5_E3OzFdw"; 
        const PARENT_PIN = "1234";
        
        let isUnrestrictedSearch = false;
        let savedFavorites = JSON.parse(localStorage.getItem('kids_fav_videos') || '[]');
        let activeVideo = null;
        let loadedShorts = [];

        lucide.createIcons();

        window.addEventListener('DOMContentLoaded', () => {
            selectCategory('Islami Tarbiyat Kids');
        });

        function showSkeletons() {
            const container = document.getElementById('videoContainer');
            container.innerHTML = Array(8).fill(`
                <div class="bg-slate-800/60 rounded-2xl overflow-hidden border border-slate-700/40 animate-pulse">
                    <div class="aspect-video bg-slate-700"></div>
                    <div class="p-4 space-y-2">
                        <div class="h-4 bg-slate-700 rounded w-3/4"></div>
                        <div class="h-3 bg-slate-700/60 rounded w-1/2"></div>
                    </div>
                </div>
            `).join('');
        }

        async function fetchYouTubeVideos(query) {
            const container = document.getElementById('videoContainer');
            const emptyState = document.getElementById('emptyState');
            
            showSkeletons();
            emptyState.classList.add('hidden');

            const searchQuery = encodeURIComponent(query + ' kids tarbiyat moral educational');
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=16&q=${searchQuery}&type=video&videoEmbeddable=true&safeSearch=strict&key=${YOUTUBE_API_KEY}`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                if (!data.items || data.items.length === 0) {
                    container.innerHTML = '';
                    emptyState.classList.remove('hidden');
                    document.getElementById('videoCount').innerText = '0 videos found';
                    return;
                }

                renderVideos(data.items);
                renderSidebarVideos(data.items);
            } catch (err) {
                console.error("API Fetch Error:", err);
                container.innerHTML = '';
                document.getElementById('emptyMessage').innerText = "Network issue or API limit reached.";
                emptyState.classList.remove('hidden');
            }
        }

        async function fetchShortsVideos(query = 'Islamic Kids Shorts Tarbiyat') {
            closeTheaterPlayer();
            document.getElementById('sectionTitle').innerHTML = `<i data-lucide="film" class="text-red-500"></i> Safe Kids Shorts`;
            
            const container = document.getElementById('videoContainer');
            const emptyState = document.getElementById('emptyState');
            
            showSkeletons();
            emptyState.classList.add('hidden');

            const searchQuery = encodeURIComponent(query + ' #shorts #kids');
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=20&q=${searchQuery}&type=video&videoDuration=short&videoEmbeddable=true&safeSearch=strict&key=${YOUTUBE_API_KEY}`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                if (!data.items || data.items.length === 0) {
                    container.innerHTML = '';
                    emptyState.classList.remove('hidden');
                    return;
                }

                loadedShorts = data.items;
                renderShortsGrid(data.items);
            } catch (err) {
                console.error("Shorts Fetch Error:", err);
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
            }
        }

        function renderVideos(items) {
            const container = document.getElementById('videoContainer');
            container.innerHTML = '';
            document.getElementById('videoCount').innerText = `${items.length} videos available`;

            items.forEach(item => {
                const videoId = item.id.videoId;
                const title = item.snippet.title;
                const thumb = item.snippet.thumbnails.medium ? item.snippet.thumbnails.medium.url : item.snippet.thumbnails.default.url;
                const channel = item.snippet.channelTitle;

                const isFav = savedFavorites.some(v => v.id === videoId);

                const card = document.createElement('div');
                card.className = "bg-slate-800 rounded-2xl overflow-hidden shadow-lg hover:shadow-2xl hover:scale-[1.02] transition duration-300 flex flex-col group border border-slate-700/60";
                card.innerHTML = `
                    <div class="relative cursor-pointer overflow-hidden aspect-video bg-slate-900" onclick="playInTheater('${videoId}', \`${escapeQuotes(title)}\`, \`${escapeQuotes(channel)}\`)">
                        <img src="${thumb}" alt="${title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        <div class="absolute inset-0 bg-black/30 group-hover:bg-black/10 transition flex items-center justify-center">
                            <div class="bg-amber-500 text-slate-950 p-3 rounded-full shadow-lg group-hover:scale-110 transition">
                                <i data-lucide="play" class="w-6 h-6 fill-slate-950"></i>
                            </div>
                        </div>
                    </div>
                    <div class="p-4 flex flex-col flex-1 justify-between">
                        <div>
                            <h4 class="font-bold text-sm text-slate-100 line-clamp-2 mb-1 cursor-pointer hover:text-amber-400 transition" onclick="playInTheater('${videoId}', \`${escapeQuotes(title)}\`, \`${escapeQuotes(channel)}\`)">${title}</h4>
                            <p class="text-xs text-slate-400 font-medium">${channel}</p>
                        </div>
                        <div class="mt-3 pt-2 border-t border-slate-700/60 flex justify-between items-center">
                            <span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 text-[10px] font-bold px-2.5 py-0.5 rounded-full">Safe Kids</span>
                            <button onclick="toggleFavorite('${videoId}', \`${escapeQuotes(title)}\`, '${thumb}', '${channel}')" class="text-slate-400 hover:text-red-500 transition">
                                <i data-lucide="heart" class="w-5 h-5 ${isFav ? 'text-red-500 fill-red-500' : ''}"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        function renderShortsGrid(items) {
            const container = document.getElementById('videoContainer');
            container.innerHTML = '';
            document.getElementById('videoCount').innerText = `${items.length} shorts available`;

            items.forEach((item, index) => {
                const title = item.snippet.title;
                const thumb = item.snippet.thumbnails.high ? item.snippet.thumbnails.high.url : item.snippet.thumbnails.medium.url;

                const card = document.createElement('div');
                card.className = "bg-slate-800 rounded-2xl overflow-hidden shadow-lg hover:shadow-2xl hover:scale-[1.02] transition duration-300 flex flex-col group border border-red-500/30 cursor-pointer relative";
                card.onclick = () => openShortsModal(index);
                card.innerHTML = `
                    <div class="relative w-full aspect-[9/16] bg-slate-900 overflow-hidden">
                        <img src="${thumb}" alt="${title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent flex flex-col justify-end p-3">
                            <div class="flex items-center gap-1.5 mb-1">
                                <span class="bg-red-600 text-white text-[9px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1">
                                    <i data-lucide="film" class="w-2.5 h-2.5"></i> Short
                                </span>
                            </div>
                            <h4 class="font-bold text-xs text-white line-clamp-2">${title}</h4>
                        </div>
                        <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                            <div class="bg-red-600 text-white p-3 rounded-full shadow-2xl scale-95 group-hover:scale-110 transition">
                                <i data-lucide="play" class="w-6 h-6 fill-white"></i>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        // FULL FINGER SCROLL SHORTS SYSTEM
        function openShortsModal(startIndex) {
            if (!loadedShorts || loadedShorts.length === 0) return;
            
            const modal = document.getElementById('shortsModal');
            const scrollContainer = document.getElementById('shortsScrollContainer');
            scrollContainer.innerHTML = '';

            // Render all shorts vertical cards in snap container
            loadedShorts.forEach((item, idx) => {
                const videoId = item.id.videoId;
                const title = item.snippet.title;
                const channel = item.snippet.channelTitle;

                const shortCard = document.createElement('div');
                shortCard.className = "w-full h-full snap-start shrink-0 relative bg-slate-950 flex flex-col justify-between overflow-hidden border-b border-slate-800";
                shortCard.dataset.index = idx;
                shortCard.dataset.videoid = videoId;

                shortCard.innerHTML = `
                    <!-- Video Embed Frame -->
                    <div class="iframe-placeholder w-full h-full relative bg-black"></div>

                    <!-- Side Actions (Like, Share) -->
                    <div class="absolute right-3 bottom-16 z-20 flex flex-col gap-5 items-center">
                        <button onclick="toggleShortLike(this)" class="flex flex-col items-center gap-1 group">
                            <div class="bg-black/50 hover:bg-black/80 p-3 rounded-full text-white border border-white/10 transition group-hover:scale-110">
                                <i data-lucide="thumbs-up" class="w-6 h-6"></i>
                            </div>
                            <span class="text-[10px] font-bold text-white shadow-sm">Like</span>
                        </button>

                        <button onclick="shareShort('${videoId}')" class="flex flex-col items-center gap-1 group">
                            <div class="bg-black/50 hover:bg-black/80 p-3 rounded-full text-white border border-white/10 transition group-hover:scale-110">
                                <i data-lucide="share-2" class="w-6 h-6"></i>
                            </div>
                            <span class="text-[10px] font-bold text-white shadow-sm">Share</span>
                        </button>
                    </div>

                    <!-- Bottom Info Overlay -->
                    <div class="absolute bottom-4 left-4 right-16 z-20 pointer-events-none bg-gradient-to-t from-black/90 via-black/40 to-transparent p-3 rounded-xl">
                        <div class="flex items-center gap-2 mb-1">
                            <div class="w-7 h-7 bg-amber-500 rounded-full flex items-center justify-center font-bold text-slate-950 text-xs">
                                <i data-lucide="smile" class="w-4 h-4"></i>
                            </div>
                            <span class="text-xs font-bold text-amber-400">@${channel}</span>
                        </div>
                        <h4 class="text-xs font-semibold text-white line-clamp-2 leading-snug">${title}</h4>
                    </div>
                `;
                scrollContainer.appendChild(shortCard);
            });

            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            lucide.createIcons();

            // Scroll to initial tapped card
            const targetCard = scrollContainer.children[startIndex];
            if (targetCard) {
                targetCard.scrollIntoView();
            }

            // Setup Intersection Observer to detect active card during scroll
            setupIntersectionObserver();
        }

        function setupIntersectionObserver() {
            const scrollContainer = document.getElementById('shortsScrollContainer');
            const cards = scrollContainer.querySelectorAll('.snap-start');

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const card = entry.target;
                    const iframeBox = card.querySelector('.iframe-placeholder');
                    const videoId = card.dataset.videoid;

                    if (entry.isIntersecting) {
                        // Load and Play iframe when active card visible
                        if (!iframeBox.querySelector('iframe')) {
                            iframeBox.innerHTML = `
                                <iframe class="w-full h-full border-0" 
                                        src="https://www.youtube.com/embed/${videoId}?autoplay=1&loop=1&playlist=${videoId}&controls=0&modestbranding=1&rel=0" 
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                        allowfullscreen>
                                </iframe>
                            `;
                        }
                    } else {
                        // Unload iframe when scrolled out to save CPU/Network
                        iframeBox.innerHTML = '';
                    }
                });
            }, {
                root: scrollContainer,
                threshold: 0.7
            });

            cards.forEach(card => observer.observe(card));
        }

        function toggleShortLike(btn) {
            btn.classList.toggle('text-amber-400');
        }

        function shareShort(videoId) {
            const url = `https://www.youtube.com/shorts/${videoId}`;
            navigator.clipboard.writeText(url);
            alert("Short Link Copied to Clipboard!");
        }

        function closeShortsModal() {
            document.getElementById('shortsScrollContainer').innerHTML = '';
            document.getElementById('shortsModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function renderSidebarVideos(items) {
            const sidebar = document.getElementById('sidebarContainer');
            sidebar.innerHTML = '';

            items.slice(0, 8).forEach(item => {
                const videoId = item.id.videoId;
                const title = item.snippet.title;
                const thumb = item.snippet.thumbnails.medium ? item.snippet.thumbnails.medium.url : item.snippet.thumbnails.default.url;
                const channel = item.snippet.channelTitle;

                const itemDiv = document.createElement('div');
                itemDiv.className = "flex gap-2.5 bg-slate-800/80 hover:bg-slate-800 p-2 rounded-xl border border-slate-700/50 cursor-pointer transition group";
                itemDiv.onclick = () => playInTheater(videoId, title, channel);
                itemDiv.innerHTML = `
                    <div class="relative w-28 aspect-video rounded-lg overflow-hidden shrink-0 bg-slate-900">
                        <img src="${thumb}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition">
                    </div>
                    <div class="overflow-hidden flex flex-col justify-center">
                        <h5 class="text-xs font-bold text-slate-200 line-clamp-2 group-hover:text-amber-400 transition">${title}</h5>
                        <p class="text-[10px] text-slate-400 mt-0.5 line-clamp-1">${channel}</p>
                    </div>
                `;
                sidebar.appendChild(itemDiv);
            });
        }

        function playInTheater(videoId, title, channel) {
            activeVideo = { id: videoId, title, channel };
            
            document.getElementById('activeVideoTitle').innerText = title;
            document.getElementById('activeChannelTitle').innerText = channel;
            document.getElementById('externalWatchBtn').href = `https://www.youtube.com/watch?v=${videoId}`;
            
            const playerBox = document.getElementById('youtubePlayerContainer');
            playerBox.innerHTML = `
                <iframe class="w-full h-full rounded-2xl" 
                        src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0" 
                        title="${title}" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        allowfullscreen>
                </iframe>
            `;

            document.getElementById('mainLogo').classList.add('hidden');
            document.getElementById('lockToggleBtn').classList.add('hidden');
            document.getElementById('categoryNav').classList.add('hidden');
            document.getElementById('searchBarWrapper').classList.add('mx-auto');

            const cinemaSection = document.getElementById('cinemaPlayerSection');
            cinemaSection.classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
            updateFavBtnState(videoId);
        }

        function closeTheaterPlayer() {
            const playerBox = document.getElementById('youtubePlayerContainer');
            playerBox.innerHTML = ''; 

            document.getElementById('cinemaPlayerSection').classList.add('hidden');

            document.getElementById('mainLogo').classList.remove('hidden');
            document.getElementById('lockToggleBtn').classList.remove('hidden');
            document.getElementById('categoryNav').classList.remove('hidden');
            document.getElementById('searchBarWrapper').classList.remove('mx-auto');
        }

        function resetToHome() {
            closeTheaterPlayer();
            selectCategory('Islami Tarbiyat Kids');
        }

        function selectCategory(categoryQuery) {
            document.getElementById('sectionTitle').innerHTML = `<i data-lucide="sparkles" class="text-amber-500"></i> ${categoryQuery.split(' ')[0]} Videos`;
            fetchYouTubeVideos(categoryQuery);
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            if (!isUnrestrictedSearch) {
                fetchYouTubeVideos(`${query} safe kids`);
            } else {
                fetchYouTubeVideos(query);
            }
            document.getElementById('sectionTitle').innerText = `Results for: "${query}"`;
        }

        function toggleFavorite(id, title, thumb, channel) {
            const index = savedFavorites.findIndex(v => v.id === id);
            if (index > -1) {
                savedFavorites.splice(index, 1);
            } else {
                savedFavorites.push({ id, title, thumb, channel });
            }
            localStorage.setItem('kids_fav_videos', JSON.stringify(savedFavorites));
            
            if (activeVideo && activeVideo.id === id) {
                updateFavBtnState(id);
            }
        }

        function toggleFavActive() {
            if (!activeVideo) return;
            const isFav = savedFavorites.some(v => v.id === activeVideo.id);
            if (isFav) {
                savedFavorites = savedFavorites.filter(v => v.id !== activeVideo.id);
            } else {
                savedFavorites.push({ id: activeVideo.id, title: activeVideo.title, thumb: `https://i.ytimg.com/vi/${activeVideo.id}/mqdefault.jpg`, channel: activeVideo.channel });
            }
            localStorage.setItem('kids_fav_videos', JSON.stringify(savedFavorites));
            updateFavBtnState(activeVideo.id);
        }

        function updateFavBtnState(id) {
            const isFav = savedFavorites.some(v => v.id === id);
            const favBtn = document.getElementById('favBtn');
            if (isFav) {
                favBtn.classList.add('text-red-500');
                favBtn.innerHTML = `<i data-lucide="heart" class="w-4 h-4 fill-red-500"></i> Saved`;
            } else {
                favBtn.classList.remove('text-red-500');
                favBtn.innerHTML = `<i data-lucide="heart" class="w-4 h-4"></i> Save`;
            }
            lucide.createIcons();
        }

        function toggleLikeActive() {
            const likeBtn = document.getElementById('likeBtn');
            const likeText = document.getElementById('likeText');
            if (likeText.innerText === "Liked") {
                likeText.innerText = "Like";
                likeBtn.classList.remove('text-amber-400');
            } else {
                likeText.innerText = "Liked";
                likeBtn.classList.add('text-amber-400');
            }
        }

        function showFavorites() {
            document.getElementById('sectionTitle').innerHTML = `<i data-lucide="heart" class="text-red-500"></i> Saved Videos`;
            const container = document.getElementById('videoContainer');
            const emptyState = document.getElementById('emptyState');

            if (savedFavorites.length === 0) {
                container.innerHTML = '';
                document.getElementById('emptyMessage').innerText = "Abhi koi favorite video save nahi hui.";
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            const mappedItems = savedFavorites.map(v => ({
                id: { videoId: v.id },
                snippet: {
                    title: v.title,
                    channelTitle: v.channel,
                    thumbnails: { medium: { url: v.thumb } }
                }
            }));
            renderVideos(mappedItems);
        }

        function openParentModal() {
            document.getElementById('pinInput').value = '';
            document.getElementById('parentModal').classList.remove('hidden');
        }

        function closeParentModal() {
            document.getElementById('parentModal').classList.add('hidden');
        }

        function verifyPIN() {
            const pin = document.getElementById('pinInput').value;
            if (pin === PARENT_PIN) {
                isUnrestrictedSearch = !isUnrestrictedSearch;
                document.getElementById('lockStatusText').innerText = isUnrestrictedSearch ? "Search: Parent Mode" : "Search: Safe Mode";
                alert(isUnrestrictedSearch ? "Parent Mode Active!" : "Safe Mode Active!");
                closeParentModal();
            } else {
                alert("Incorrect PIN!");
            }
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }
    </script>
</body>
</html>
