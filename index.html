<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pine Hills Kids Safe Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            background-color: #0d0d12;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
        }
        body { display: flex; justify-content: center; align-items: center; }
        
        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            position: relative;
            overflow: hidden;
            background-color: #000;
            box-shadow: 0 0 60px rgba(0,0,0,0.9);
        }

        /* HEADER */
        .header-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 14px 16px;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-brand { display: flex; align-items: center; gap: 10px; }
        .header-logo-img {
            width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
            border: 2px solid #ffd700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }
        .school-name { font-size: 14px; font-weight: 800; color: #fff; }
        .school-tagline { font-size: 10px; color: #ffd700; font-weight: 600; }
        .safe-badge {
            background: rgba(32, 213, 236, 0.2);
            border: 1px solid #20d5ec;
            color: #20d5ec;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
        }

        /* FEED STREAM CONTAINER */
        #feedWrapper {
            width: 100%;
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        /* Hide Scrollbar */
        #feedWrapper::-webkit-scrollbar { display: none; }
        #feedWrapper { -ms-overflow-style: none; scrollbar-width: none; }

        .video-post {
            position: relative;
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            background-color: #000;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* OVERLAY INFO */
        .video-info-overlay {
            position: absolute;
            left: 0;
            bottom: 60px;
            width: 100%;
            padding: 20px 16px;
            z-index: 15;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
            pointer-events: none;
        }
        .video-title { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 4px; line-height: 1.3; }
        .channel-name { font-size: 12px; color: #ffd700; font-weight: 600; }

        /* SCROLL CONTROLS FOR EASY SWIPE */
        .scroll-btn-wrapper {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 90;
        }
        .scroll-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.3);
            color: #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        /* NAVIGATION BAR */
        .bottom-nav-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 56px;
            background: rgba(13, 13, 18, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: #8a8a9e;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
        }
        .nav-item.active { color: #ffd700; }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }

        .loading-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #ffd700;
            font-size: 14px;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">
        
        <!-- Header -->
        <div class="header-wrapper">
            <div class="header-brand">
                <img src="real logo copy.jpg" alt="Logo" class="header-logo-img" onerror="this.style.display='none'">
                <div>
                    <div class="school-name">PINE HILLS</div>
                    <div class="school-tagline">Kids Tarbiyat Feed</div>
                </div>
            </div>
            <div class="safe-badge">🛡️ 100% Safe Kids Zone</div>
        </div>

        <!-- Scroll Buttons for Kids -->
        <div class="scroll-btn-wrapper">
            <button class="scroll-btn" onclick="scrollFeed('up')">▲</button>
            <button class="scroll-btn" onclick="scrollFeed('down')">▼</button>
        </div>

        <!-- Video Stream Container -->
        <div id="feedWrapper">
            <div class="loading-box">
                <span>✨ Auto-Loading Safe Content...</span>
            </div>
        </div>

        <!-- Navigation Bar -->
        <div class="bottom-nav-bar">
            <div class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Safe Feed</span>
            </div>
            <div class="nav-item" onclick="fetchEducationalVideos()">
                <svg viewBox="0 0 24 24"><path d="M12 6v3l4-4-4-4v3c-4.42 0-8 3.58-8 8 0 1.57.46 3.03 1.24 4.26L6.7 17.72C5.62 16.07 5 14.11 5 12c0-3.87 3.13-7 7-7z"/></svg>
                <span>Refresh</span>
            </div>
        </div>
    </div>

    <script>
        const YOUTUBE_API_KEY = "AIzaSyBjFaFHtHp2auL96X20FR3ivu5_E3OzFdw";

        const safeSearchQueries = [
            "Islamic moral stories for kids Urdu animated",
            "Urdu nursery rhymes moral lessons",
            "Kids science experiments simple Urdu",
            "Pencil drawing step by step for kids",
            "Prophet stories for children Urdu"
        ];

        const feedWrapper = document.getElementById('feedWrapper');

        async function fetchEducationalVideos() {
            feedWrapper.innerHTML = '<div class="loading-box"><span>✨ Searching Safe Content...</span></div>';
            
            const selectedTopic = safeSearchQueries[Math.floor(Math.random() * safeSearchQueries.length)];
            const apiUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=15&q=${encodeURIComponent(selectedTopic)}&type=video&videoEmbeddable=true&safeSearch=strict&key=${YOUTUBE_API_KEY}`;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (!data.items || data.items.length === 0) {
                    feedWrapper.innerHTML = '<div class="loading-box">No videos found. Check API key.</div>';
                    return;
                }

                feedWrapper.innerHTML = '';

                data.items.forEach((item, index) => {
                    const videoId = item.id.videoId;
                    const title = item.snippet.title;
                    const channel = item.snippet.channelTitle;

                    const postBlock = document.createElement('div');
                    postBlock.className = 'video-post';

                    postBlock.innerHTML = `
                        <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=${index === 0 ? 1 : 0}&controls=1&rel=0&playsinline=1" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowfullscreen></iframe>
                        
                        <div class="video-info-overlay">
                            <div class="video-title">${title}</div>
                            <div class="channel-name">📺 ${channel}</div>
                        </div>
                    `;
                    feedWrapper.appendChild(postBlock);
                });

                feedWrapper.scrollTop = 0;

            } catch (error) {
                console.error("API Fetch Error:", error);
                feedWrapper.innerHTML = '<div class="loading-box">Failed to load content. Please verify YouTube API Key.</div>';
            }
        }

        // Button Controls for easy scrolling
        function scrollFeed(direction) {
            const h = window.innerHeight;
            if(direction === 'down') {
                feedWrapper.scrollBy({ top: h, behavior: 'smooth' });
            } else {
                feedWrapper.scrollBy({ top: -h, behavior: 'smooth' });
            }
        }

        if(YOUTUBE_API_KEY !== "YOUR_YOUTUBE_API_KEY") {
            fetchEducationalVideos();
        }
    </script>
</body>
</html>
