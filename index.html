<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pine Hills Kids Safe Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
        }
        body { display: flex; justify-content: center; align-items: center; }
        
        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            position: relative;
            overflow: hidden;
            background-color: #000;
        }

        /* HEADER */
        .header-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 14px 16px;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .header-brand { display: flex; align-items: center; gap: 10px; pointer-events: auto; }
        .header-logo-img {
            width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
            border: 2px solid #ffd700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }
        .school-name { font-size: 14px; font-weight: 800; color: #fff; }
        .school-tagline { font-size: 10px; color: #ffd700; font-weight: 600; }
        .safe-badge {
            background: rgba(32, 213, 236, 0.2);
            border: 1px solid #20d5ec;
            color: #20d5ec;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            pointer-events: auto;
        }

        /* FEED VIEWPORT */
        .feed-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .video-card {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: none;
        }

        .video-card.active {
            display: block;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* OVERLAY INFO */
        .video-info-overlay {
            position: absolute;
            left: 0;
            bottom: 60px;
            width: 100%;
            padding: 20px 16px;
            z-index: 15;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 100%);
            pointer-events: none;
        }
        .video-title { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 6px; line-height: 1.3; }
        .channel-name { font-size: 12px; color: #ffd700; font-weight: 600; }

        /* TOUCH CAPTURE OVERLAY FOR SWIPE */
        .touch-swipe-layer {
            position: absolute;
            top: 70px;
            left: 0;
            width: 100%;
            height: calc(100% - 130px);
            z-index: 50;
        }

        /* NAVIGATION BAR */
        .bottom-nav-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 56px;
            background: rgba(13, 13, 18, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: #8a8a9e;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
        }
        .nav-item.active { color: #ffd700; }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }

        .loading-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #ffd700;
            font-size: 14px;
            gap: 10px;
            text-align: center;
            padding: 20px;
        }

        /* SIDE ARROWS FOR DESKTOP/CLICK SCROLL */
        .side-nav-btn {
            position: absolute;
            right: 12px;
            bottom: 120px;
            z-index: 90;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,215,0,0.5);
            color: #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Header -->
        <div class="header-wrapper">
            <div class="header-brand">
                <img src="real logo copy.jpg" alt="Logo" class="header-logo-img" onerror="this.style.display='none'">
                <div>
                    <div class="school-name">PINE HILLS</div>
                    <div class="school-tagline">Kids Tarbiyat Feed</div>
                </div>
            </div>
            <div class="safe-badge">🛡️ 100% Safe Zone</div>
        </div>

        <!-- Video Player Display -->
        <div class="feed-container" id="feedContainer">
            <div class="loading-box" id="loadingState">
                <span>✨ Loading Fresh Safe Content...</span>
            </div>
        </div>

        <!-- Touch Layer for Swipe Control -->
        <div class="touch-swipe-layer" id="touchLayer"></div>

        <!-- Right Side Scroll Buttons -->
        <div class="side-nav-btn">
            <div class="btn-circle" onclick="playPreviousVideo()">▲</div>
            <div class="btn-circle" onclick="playNextVideo()">▼</div>
        </div>

        <!-- Navigation Bar -->
        <div class="bottom-nav-bar">
            <div class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Safe Feed</span>
            </div>
            <div class="nav-item" onclick="refreshFeed()">
                <svg viewBox="0 0 24 24"><path d="M12 6v3l4-4-4-4v3c-4.42 0-8 3.58-8 8 0 1.57.46 3.03 1.24 4.26L6.7 17.72C5.62 16.07 5 14.11 5 12c0-3.87 3.13-7 7-7z"/></svg>
                <span>Refresh</span>
            </div>
        </div>
    </div>

    <script>
        const YOUTUBE_API_KEY = "AIzaSyBjFaFHtHp2auL96X20FR3ivu5_E3OzFdw";

        const safeSearchTopics = [
            "Urdu moral stories animated kids",
            "Islamic stories prophet stories Urdu kids",
            "Urdu poem nursery rhymes kids",
            "Pencil drawing easy step by step kids",
            "Kids science experiments Urdu simple",
            "Sabaq amoz kahaniyan Urdu kids",
            "Good habits for children Urdu animated"
        ];

        let videoPlaylist = [];
        let loadedVideoIds = new Set();
        let currentIndex = -1;
        let isNavigating = false;

        const feedContainer = document.getElementById('feedContainer');
        const touchLayer = document.getElementById('touchLayer');

        async function fetchMoreVideos() {
            const topic = safeSearchTopics[Math.floor(Math.random() * safeSearchTopics.length)];
            const apiUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=${encodeURIComponent(topic)}&type=video&videoEmbeddable=true&safeSearch=strict&key=${YOUTUBE_API_KEY}`;

            try {
                const res = await fetch(apiUrl);
                const data = await res.json();

                if (data.items && data.items.length > 0) {
                    data.items.forEach(item => {
                        const vId = item.id.videoId;
                        if (!loadedVideoIds.has(vId)) {
                            loadedVideoIds.add(vId);
                            videoPlaylist.push({
                                id: vId,
                                title: item.snippet.title,
                                channel: item.snippet.channelTitle
                            });
                        }
                    });
                }
            } catch (err) {
                console.error("API Fetch Error:", err);
            }
        }

        async function renderVideo(index) {
            if (index < 0 || index >= videoPlaylist.length) return;

            // Stop all existing video cards by cleaning container or re-creating iframe source to enforce Autoplay
            const item = videoPlaylist[index];
            feedContainer.innerHTML = `
                <div class="video-card active" id="card-${index}">
                    <iframe id="iframe-${index}"
                            src="https://www.youtube.com/embed/${item.id}?autoplay=1&mute=0&enablejsapi=1&rel=0&playsinline=1" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen></iframe>
                    <div class="video-info-overlay">
                        <div class="video-title">${item.title}</div>
                        <div class="channel-name">📺 ${item.channel}</div>
                    </div>
                </div>
            `;

            // Auto fetch more videos when near end
            if (videoPlaylist.length - index <= 3) {
                fetchMoreVideos();
            }
        }

        async function playNextVideo() {
            if (isNavigating) return;
            isNavigating = true;

            if (currentIndex + 1 < videoPlaylist.length) {
                currentIndex++;
                await renderVideo(currentIndex);
            } else {
                await fetchMoreVideos();
                if (currentIndex + 1 < videoPlaylist.length) {
                    currentIndex++;
                    await renderVideo(currentIndex);
                }
            }

            setTimeout(() => { isNavigating = false; }, 300);
        }

        async function playPreviousVideo() {
            if (isNavigating) return;
            isNavigating = true;

            if (currentIndex > 0) {
                currentIndex--;
                await renderVideo(currentIndex);
            }

            setTimeout(() => { isNavigating = false; }, 300);
        }

        async function initFeed() {
            await fetchMoreVideos();
            if (videoPlaylist.length > 0) {
                currentIndex = 0;
                renderVideo(currentIndex);
            }
        }

        async function refreshFeed() {
            feedContainer.innerHTML = '<div class="loading-box" id="loadingState"><span>✨ Loading New Videos...</span></div>';
            videoPlaylist = [];
            loadedVideoIds.clear();
            currentIndex = -1;
            await initFeed();
        }

        // SWIPE & SCROLL DETECTOR
        let touchStartY = 0;
        touchLayer.addEventListener('touchstart', (e) => touchStartY = e.touches[0].clientY, { passive: true });
        touchLayer.addEventListener('touchend', (e) => {
            let touchEndY = e.changedTouches[0].clientY;
            let diff = touchStartY - touchEndY;
            if (Math.abs(diff) > 40) {
                if (diff > 0) playNextVideo();
                else playPreviousVideo();
            }
        }, { passive: true });

        // MOUSE WHEEL SCROLL FOR PC (Debounced)
        let wheelTimeout;
        window.addEventListener('wheel', (e) => {
            clearTimeout(wheelTimeout);
            wheelTimeout = setTimeout(() => {
                if (e.deltaY > 0) playNextVideo();
                else playPreviousVideo();
            }, 50);
        });

        initFeed();
    </script>
</body>
</html>
